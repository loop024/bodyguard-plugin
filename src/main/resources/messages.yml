prefix: "&9[BodyGuard]&r "

help:
  - "&b----- BodyGuard ヘルプ -----"
  - "&f/bg summon <mob> &7- 護衛を召喚"
  - "&f/bg recruit &7- 見ている敵モブを護衛にする"
  - "&f/bg release &7- 見ている護衛を解除"
  - "&f/bg releaseall confirm &7- 自分の護衛をすべて解除"
  - "&f/bg list &7- 護衛一覧を表示"
  - "&f/bg tp &7- 護衛を自分の周辺へ移動"
  - "&f/bg mode <follow|stay|guard> &7- モード変更"
  - "&f/bg rename <名前> &7- 護衛の名前を変更"
  - "&f/bg heal &7- 護衛を全回復"
  - "&f/bg reload &7- 設定を再読み込み（管理者）"

