# BodyGuard 1.0.0 default configuration
general:
  language: ja

storage:
  # Save changed guard data periodically. Set to 0 to disable periodic saves.
  autosave-seconds: 60

limits:
  max-guards-per-player: 10

guard-management:
  # Keep guards belonging to online owners loaded so health, location and actions
  # remain available. Many guards spread across many chunks will use more memory.
  keep-chunks-loaded-while-owner-online: true
  # Global number of chunk tickets BodyGuard may hold at once.
  max-loaded-chunks: 64
  # Maximum distinct guard chunks assigned to one online owner.
  max-loaded-chunks-per-owner: 16
  # Maximum new chunk tickets requested during one management cycle.
  chunk-loads-per-cycle: 2
  # Maximum already-loaded chunks inspected for a missing guard per cycle.
  search-chunks-per-cycle: 32

# Right-click this item in the main hand to open the BodyGuard menu.
# Any valid Minecraft material name can be used, for example: COMPASS, BLAZE_ROD.
menu-opener:
  material: COMPASS

tutorial:
  # Show the guide before the first /bg or protected-menu-item use.
  enabled: true
  # Set false to limit automatic display to players on their first server session.
  show-to-existing-players: true

follow:
  start-distance: 5.0
  teleport-distance: 30.0
  move-speed: 0.32

teleport:
  different-world: true
  max-distance: 30.0

combat:
  defend-against-players: true
  assist-owner-attacks: true
  defend-owner: true
  target-range: 25.0
  combat-grace-seconds: 8.0

friendly-fire:
  owner-can-damage-guards: false
  guards-can-damage-owner: false
  guards-can-damage-each-other: false

stay-mode:
  defend-owner: true
  return-to-position: true
  return-distance: 24.0

guard-mode:
  radius: 15.0
  return-distance: 30.0

display:
  show-name: true
  # Uses the Mob's standard one-line custom name; no display Entity is created.
  nameplate:
    enabled: true
    mode: NAME_HEALTH_MODE
    low-health-ratio: 0.25
  # New guards use {mob_name} and a per-owner/type {number}; old/custom templates remain valid.
  default-name: "{mob_name}護衛 {number}"
  # GUI refreshes values in place. Set to 0 to disable automatic refresh.
  gui-refresh-interval-ticks: 20
  gui-result-seconds: 5
  # The action bar only targets a visible, nearby guard owned by the player.
  action-bar:
    enabled: true
    interval-ticks: 5
    range: 10.0

effects:
  enabled: true
  # Short world feedback emitted only when a guard operation succeeds.
  guard-feedback:
    enabled: true
    summon: true
    mode-change: true
    heal: true
    recall: true
    release: true
    low-health:
      enabled: true
    particle-count: 10
    range: 24.0
    low-health-ratio: 0.25
    low-health-cooldown-seconds: 30
  # GUI sounds are sent only to the player who used the GUI.
  gui-sounds:
    enabled: true
    success-sound: UI_BUTTON_CLICK
    failure-sound: BLOCK_NOTE_BLOCK_BASS
    volume: 0.35
    success-pitch: 1.25
    failure-pitch: 0.75

# Every command and GUI operation displays an unmistakable title to the player.
notifications:
  operation-titles:
    enabled: true
    duration-ticks: 50

owner-offline:
  freeze-guards: true

allowed-mobs:
  - ZOMBIE
  - SKELETON
  - HUSK
  - STRAY
  - DROWNED
  - BOGGED
  - WITHER_SKELETON
  - ZOMBIFIED_PIGLIN
  - SPIDER
  - CAVE_SPIDER
  - PILLAGER
  - VINDICATOR
