# BodyGuard 1.0.0 default configuration
general:
  language: ja

storage:
  # Save changed guard data periodically. Set to 0 to disable periodic saves.
  autosave-seconds: 60

limits:
  max-guards-per-player: 10

# Right-click this item in the main hand to open the BodyGuard menu.
# Any valid Minecraft material name can be used, for example: COMPASS, BLAZE_ROD.
menu-opener:
  material: COMPASS

follow:
  start-distance: 5.0
  teleport-distance: 30.0
  move-speed: 0.32

teleport:
  different-world: true
  max-distance: 30.0

combat:
  defend-against-players: true
  assist-owner-attacks: true
  defend-owner: true
  target-range: 25.0
  combat-grace-seconds: 8.0

friendly-fire:
  owner-can-damage-guards: false
  guards-can-damage-owner: false
  guards-can-damage-each-other: false

stay-mode:
  defend-owner: true
  return-to-position: true
  return-distance: 24.0

guard-mode:
  radius: 15.0
  return-distance: 30.0

display:
  show-name: true
  # New guards use {mob_name} and a per-owner/type {number}; old/custom templates remain valid.
  default-name: "{mob_name}護衛 {number}"
  # GUI refreshes values in place. Set to 0 to disable automatic refresh.
  gui-refresh-interval-ticks: 20
  gui-result-seconds: 5
  # The action bar only targets a visible, nearby guard owned by the player.
  action-bar:
    enabled: true
    interval-ticks: 5
    range: 10.0

effects:
  enabled: true
  # GUI sounds are sent only to the player who used the GUI.
  gui-sounds:
    enabled: true
    success-sound: UI_BUTTON_CLICK
    failure-sound: BLOCK_NOTE_BLOCK_BASS
    volume: 0.35
    success-pitch: 1.25
    failure-pitch: 0.75

owner-offline:
  freeze-guards: true

allowed-mobs:
  - ZOMBIE
  - SKELETON
  - HUSK
  - STRAY
  - DROWNED
  - BOGGED
  - WITHER_SKELETON
  - ZOMBIFIED_PIGLIN
  - SPIDER
  - CAVE_SPIDER
  - PILLAGER
  - VINDICATOR
